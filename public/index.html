<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PROZ CENTER · Prontuário</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--side:#4a62ad;--pri:#0d3b9e;--navy:#0a2a6e;--bg:#eef1f8;--tx:#16213a;--mut:#6a7690;--bd:#d9e0f0;--red:#d32f2f;--grn:#2e7d32;--yel:#f2b705}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 Poppins,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:18px 0;display:flex;flex-direction:column}
.brand{display:flex;gap:8px;align-items:center;padding:0 18px 22px;font-weight:600;line-height:1.1;letter-spacing:.5px}
.brand svg{width:34px;height:34px;flex:none}
.nav{background:none;border:0;color:#fff;text-align:left;padding:14px 18px;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;font-weight:500}
.nav:hover,.nav.on{background:rgba(255,255,255,.18)}
.main{padding:16px 22px}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.search{flex:1;background:var(--pri);border:0;border-radius:99px;padding:10px 18px;color:#fff}.search::placeholder{color:#c9d6f6}
.me{font-size:12px;text-align:right;color:var(--mut)}.me b{color:var(--tx);display:block}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:18px}
.tile{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:18px;text-align:left;cursor:pointer;display:block;width:100%}
.tile b{display:block;font-size:26px}.tile.y{background:var(--yel);color:#3a2d00}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--pri);color:#fff;border:0;border-radius:99px;padding:8px 18px;cursor:pointer;font-weight:600}
.btn.s{padding:4px 12px;font-size:12px}.btn.o{background:#e3eafb;color:var(--pri)}.btn.r{background:var(--red)}.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;background:#f7f9fd;border:1px solid var(--bd);border-radius:8px;padding:8px}
label{display:block;font-size:12px;color:var(--mut);margin:9px 0 3px}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:var(--pri);color:#fff;font-weight:500;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}
tr.lk{cursor:pointer}tr.lk:hover td{background:#f3f6fd}.tw{overflow-x:auto}
.tag{font-size:11px;padding:2px 10px;border-radius:99px;background:#dff3e2;color:var(--grn);font-weight:600}.tag.x{background:#fde3e3;color:var(--red)}
.by{font-size:11px;color:var(--mut)}.alert{color:var(--red);font-weight:600}
.ob{background:#fde3e3;color:var(--red);padding:10px;border-radius:10px;margin-bottom:12px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.vit div{border:1px solid var(--bd);border-radius:10px;padding:8px}.vit b{font-size:18px;display:block}.vit span{font-size:11px;color:var(--mut)}
.note{border-bottom:1px solid var(--bd);padding:8px 0}.note p{margin:4px 0;white-space:pre-wrap}
.yel{background:#fff6d6;border-color:var(--yel)}
dialog{border:0;border-radius:14px;width:min(520px,94vw);padding:18px}dialog::backdrop{background:rgba(0,0,0,.5)}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0a2a6e,#1b4fd0);padding:16px}
.lbox{background:var(--navy);color:#fff;border-radius:14px;padding:28px;width:min(340px,100%);text-align:center}
.lbox input{background:#c9d6f6;border:0;color:#10224d;border-radius:99px;padding:10px 16px;margin-bottom:10px}
.lbox .btn{width:100%;background:#1d54d6}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding:0}.brand{display:none}.nav{white-space:nowrap;padding:12px}.g2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><dialog id="dlg"></dialog>
<script>
/* ========= CONFIGURAÇÃO DO BANCO DE DADOS =========
 backend:'mysql' -> conversa com a API (proz-backend/server.js), que grava no MySQL.
 backend:'local' -> localStorage, só para demonstração.
 Em url coloque o endereço da API (ex.: https://api.meu-hospital.com). */
const CFG={backend:'mysql',url:location.protocol.startsWith('http')?'':'http://localhost:3000'};
const OK=()=>CFG.backend==='mysql';
const K='prontuario_psiq_db';let db={pts:[],log:[]},TOKEN=null;
const rest=(path,m='GET',b)=>fetch(CFG.url+'/api/'+path,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:b?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const API={
 async load(){
  if(!OK()){try{return JSON.parse(localStorage.getItem(K))||{pts:[],log:[]}}catch(e){return{pts:[],log:[]}}}
  const[a,b]=await Promise.all([rest('prontuarios'),rest('auditoria')]);return{pts:a,log:b}},
 async savePt(p){if(!OK())return this.local();await rest('prontuarios/'+p.id,'PUT',p)},
 async addLog(l){if(!OK())return this.local();await rest('auditoria','POST',l)},
 local(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
};
const sync=async fn=>{try{await fn()}catch(e){alert('Falha ao salvar no banco de dados: '+e.message)}};

/* ========= APLICAÇÃO ========= */
const USERS=[{u:'medico',p:'1234',nome:'Dr. Rafael Mendes',reg:'CRM 65432',role:'Médico'},{u:'tecnico',p:'1234',nome:'Ana Souza',reg:'COREN 123456',role:'Técnico'}];
let me=null,pid=null,tab='inicio',q='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIn=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fmt=t=>{try{return new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}catch(e){return t}};
const fd=d=>d?d.split('-').reverse().join('/'):'-';
const age=d=>d?Math.floor((Date.now()-new Date(d))/31557600000):'';
const who=()=>({by:me.nome,reg:me.reg,role:me.role});
const P=()=>db.pts.find(p=>p.id===pid);
const num=p=>'#'+String(db.pts.indexOf(p)+1).padStart(5,'0');
function log(p,acao){const l={ts:new Date().toISOString(),pid:p.id,nome:p.nome,acao,...who()};db.log.push(l);sync(()=>API.addLog(l))}
const persist=p=>sync(()=>API.savePt(p));
const go=(t,id)=>{tab=t;if(id)pid=id;view()};
const heart='<svg viewBox="0 0 40 40"><path d="M20 35S4 25 4 14a8 8 0 0 1 16-2 8 8 0 0 1 16 2c0 11-16 21-16 21z" fill="#fff"/><path d="M20 12v14M13 19h14" stroke="#4a62ad" stroke-width="4"/></svg>';
function modal(html,fn){const d=$('#dlg');d.innerHTML=html;d.showModal();d.querySelector('form').onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target)));d.close()};d.querySelector('[data-x]').onclick=()=>d.close()}
const foot='<div style="display:flex;gap:8px;margin-top:14px"><button class="btn">Salvar</button><button type="button" class="btn o" data-x>Cancelar</button></div>';

function view(){
 if(!me){$('#app').innerHTML=`<div class="login"><div class="lbox"><div class="brand" style="justify-content:center;padding:0 0 16px">${heart}<span>PROZ<br>CENTER</span></div><p><b>Acesse sua conta!</b></p><form onsubmit="login(this);return false"><input name="u" placeholder="Usuário" required><input name="p" type="password" placeholder="Senha" required><p id="err" style="color:#ffb4b4;margin:0 0 8px"></p><button class="btn">ENTRAR</button></form><p style="font-size:11px;color:#a9bbe8">Acesse com o usuário criado no banco</p></div></div>`;return}
 const nav=[['inicio','🏠','Início'],['pacientes','👥','Pacientes'],['prontuario','📄','Prontuários'],['setembro','🎗️','Setembro Amarelo'],['config','⚙️','Configurações']];
 const t=tab==='evolucao'?'prontuario':tab;
 $('#app').innerHTML=`<div class="app"><nav class="side"><div class="brand">${heart}<span>PROZ<br>CENTER</span></div>${nav.map(n=>`<button class="nav ${t===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')}</nav><main class="main"><div class="bar"><input class="search" placeholder="Buscar paciente, prontuário, nº de atendimento..." value="${esc(q)}" oninput="busca(this.value)"><div class="me"><b>${esc(me.nome)}</b>${esc(me.role)} · ${esc(me.reg)}</div></div>${OK()?'':'<div class="ob">Banco de dados online não configurado: os dados estão sendo salvos apenas neste navegador. Defina CFG.backend como 'mysql'.</div>'}<div id="pg">${page()}</div></main></div>`}
function busca(v){q=v;if(tab!=='pacientes'){tab='pacientes';view();const i=$('.search');i.focus();i.setSelectionRange(v.length,v.length)}else $('#pg').innerHTML=page()}
function page(){return({inicio,pacientes,prontuario,evolucao,setembro,config})[tab]()}
async function login(f){const d=new FormData(f),u=d.get('u').trim().toLowerCase(),p=d.get('p');
 try{if(OK()){const r=await fetch(CFG.url+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u,p})});if(!r.ok)throw 0;const j=await r.json();TOKEN=j.token;me=j.user}
 else{const x=USERS.find(x=>x.u===u&&x.p===p);if(!x)throw 0;me=x}
 db=await API.load()}catch(e){$('#err').textContent=OK()?'Usuário ou senha inválidos, ou servidor indisponível.':'Usuário ou senha inválidos.';return false}
 tab='inicio';view();return false}

function inicio(){const hoje=new Date().toISOString().slice(0,10),i=db.pts.filter(p=>p.status!=='Óbito').length,n=db.pts.filter(p=>p.criado.ts.slice(0,10)===hoje).length;
 return `<h1>Olá, ${esc(me.nome)}!</h1><p class="sub">Aqui você encontra seus pacientes, prontuários e informações importantes do hospital.</p>
 <div class="big"><button class="tile" onclick="go('pacientes')">Pacientes internados<b>${i}</b></button><button class="tile" onclick="go('pacientes')">Novos pacientes hoje<b>${n}</b></button></div>
 <h2>Acesso rápido</h2><div class="pills"><button class="btn" onclick="go('pacientes')">Pacientes</button><button class="btn" onclick="newP()">+ Criar prontuário</button><button class="btn" onclick="go('setembro')">Setembro Amarelo</button></div>`}

function pacientes(){const l=db.pts.filter(p=>(p.nome+p.leito+num(p)).toLowerCase().includes(q.toLowerCase()));
 return `<h2><span style="font-size:20px">Pacientes</span><button class="btn" onclick="newP()">+ Criar prontuário</button></h2><p class="sub">Lista de pacientes no hospital</p><div class="card tw"><table><tr><th>Nº Prontuário</th><th>Paciente</th><th>Leito</th><th>Motivo da internação</th><th>Status</th></tr>${l.map(p=>`<tr class="lk" onclick="go('prontuario','${p.id}')"><td>${num(p)}</td><td><b>${esc(p.nome)}</b></td><td>${esc(p.leito)}</td><td>${esc(p.motivo)}</td><td><span class="tag ${p.status==='Óbito'?'x':''}">${esc(p.status)}</span></td></tr>`).join('')||'<tr><td colspan=5 class="by">Nenhum prontuário encontrado. Clique em “Criar prontuário” para começar.</td></tr>'}</table></div>`}

function prontuario(){const p=P();if(!p)return pacientes();const v=p.vitais||{},ob=p.status==='Óbito',lk=ob?'disabled':'';
 return `${ob?'<div class="ob">Paciente em óbito — registros bloqueados.</div>':''}
 <h2><span style="font-size:20px">Prontuário ${num(p)}</span><span><button class="btn o s" onclick="go('pacientes')">Voltar</button> <button class="btn s" ${lk} onclick="go('evolucao')">Nova evolução clínica</button></span></h2>
 <div class="card"><h2><span style="font-size:18px">${esc(p.nome)}</span><span class="tag ${ob?'x':''}">${esc(p.status)}</span></h2>
 <div class="row" style="grid-template-columns:repeat(4,1fr)"><div><span class="by">Sexo</span><br>${esc(p.sexo)}</div><div><span class="by">Nascimento</span><br>${fd(p.nasc)} (${age(p.nasc)} anos)</div><div><span class="by">Leito</span><br>${esc(p.leito)}</div><div><span class="by">Alergias</span><br><span class="${p.alergias?'alert':''}">${esc(p.alergias||'Nenhuma informada')}</span></div></div>
 <p class="by">Prontuário criado por ${esc(p.criado.by)} (${esc(p.criado.reg)}) em ${fmt(p.criado.ts)}</p></div>
 <div class="g2"><div>
 <div class="card"><h2>Sinais vitais <button class="btn s" ${lk} onclick="vit()">Registrar</button></h2><div class="vit"><div><span>PA</span><b>${esc(v.pa||'-')}</b></div><div><span>FC (bpm)</span><b>${esc(v.fc||'-')}</b></div><div><span>FR (irpm)</span><b>${esc(v.fr||'-')}</b></div><div><span>SpO₂ (%)</span><b>${esc(v.spo2||'-')}</b></div><div><span>Temp (°C)</span><b>${esc(v.temp||'-')}</b></div><div><span>Dor (0-10)</span><b>${esc(v.dor||'-')}</b></div></div><p class="by">${v.ts?`Última aferição: ${fmt(v.ts)} por ${esc(v.by)} (${esc(v.reg)})`:'Sem registro'}</p></div>
 <div class="card"><h2>Medicação <button class="btn s" ${lk} onclick="med()">Registrar</button></h2><div class="tw"><table><tr><th>Medicamento</th><th>Dose</th><th>Via</th><th>Horário</th><th>Por</th></tr>${(p.meds||[]).map(m=>`<tr><td>${esc(m.med)}<div class="by">${esc(m.obs)}</div></td><td>${esc(m.dose)}</td><td>${esc(m.via)}</td><td>${esc(m.hor)}</td><td class="by">${esc(m.by)} (${esc(m.reg)})<br>${fmt(m.ts)}</td></tr>`).join('')||'<tr><td colspan=5 class="by">Nenhuma medicação registrada.</td></tr>'}</table></div></div></div>
 <div><div class="card"><h2>Evolução clínica</h2>${(p.notas||[]).slice().reverse().map(n=>`<div class="note"><b>${fmt(n.dh)}</b> ${n.obito?'<span class="tag x">ÓBITO</span>':''}<div class="by">Motivo da internação: ${esc(n.motivo)}</div><p>${esc(n.texto)}</p><div class="by">Registro técnico: ${esc(n.by)} — ${esc(n.reg)}</div></div>`).join('')||'<p class="by">Nenhuma anotação registrada.</p>'}</div>
 <div class="card"><h2>Histórico de alterações</h2><div class="tw"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th></tr>${db.log.filter(l=>l.pid===p.id).slice().reverse().map(l=>`<tr><td>${fmt(l.ts)}</td><td>${esc(l.by)}<div class="by">${esc(l.role)} · ${esc(l.reg)}</div></td><td>${esc(l.acao)}</td></tr>`).join('')}</table></div></div></div></div>`}

function evolucao(){const p=P();if(!p||p.status==='Óbito')return prontuario();
 return `<h2><span style="font-size:20px">Nova evolução clínica</span></h2><p class="sub">${esc(p.nome)} · Prontuário ${num(p)}</p>
 <form class="card" onsubmit="return saveNota(this)"><div class="row"><div><label>Data e hora *</label><input type="datetime-local" name="dh" value="${nowIn()}" required></div><div><label>Registro técnico</label><input value="${esc(me.nome+' — '+me.reg)}" readonly></div></div>
 <label>Motivo da internação *</label><input name="motivo" value="${esc(p.motivo)}" required><label>Anotação *</label><textarea name="texto" rows="8" required></textarea>
 <label style="display:flex;gap:8px;align-items:center;color:var(--red)"><input type="checkbox" name="obito" value="1" style="width:auto"> Informar óbito do paciente</label>
 <div style="display:flex;gap:8px;margin-top:14px"><button class="btn">Registrar evolução</button><button type="button" class="btn o" onclick="go('prontuario')">Cancelar</button></div></form>`}
function saveNota(f){const d=Object.fromEntries(new FormData(f)),p=P(),ob=!!d.obito;
 p.notas.push({dh:d.dh,motivo:d.motivo,texto:d.texto,obito:ob,ts:new Date().toISOString(),...who()});if(ob)p.status='Óbito';

function config(){return `<h1>Configurações</h1><p class="sub">Gerencie seu acesso e dados.</p><div class="card"><h2>${esc(me.nome)}</h2><p class="by">${esc(me.role)} · ${esc(me.reg)}</p><p class="by">Armazenamento: ${!OK()?'SOMENTE neste navegador (banco online não configurado)':'banco de dados MySQL'}</p></div><div class="card"><h2>Sair do sistema <button class="btn r s" onclick="me=null;pid=null;view()">Sair</button></h2><p class="by">Encerre seu acesso com segurança.</p></div>`}

function newP(){modal(`<form><h2>Criar prontuário</h2><label>Nome *</label><input name="nome" required><div class="row"><div><label>Sexo *</label><select name="sexo"><option>Feminino</option><option>Masculino</option><option>Outro</option></select></div><div><label>Data de nascimento *</label><input type="date" name="nasc" required></div></div><div class="row"><div><label>Leito *</label><input name="leito" required></div><div><label>Alergias</label><input name="alergias" placeholder="Nenhuma"></div></div><label>Motivo da internação *</label><input name="motivo" required><label>Sinais vitais iniciais</label><div class="row" style="grid-template-columns:repeat(3,1fr)"><input name="pa" placeholder="PA 120/80"><input name="fc" placeholder="FC"><input name="fr" placeholder="FR"><input name="spo2" placeholder="SpO₂"><input name="temp" placeholder="Temp"><input name="dor" placeholder="Dor 0-10"></div>${foot}</form>`,d=>{
 const ts=new Date().toISOString(),p={id:'p'+Date.now(),nome:d.nome.trim(),sexo:d.sexo,nasc:d.nasc,leito:d.leito.trim(),alergias:d.alergias.trim(),motivo:d.motivo.trim(),status:'Internado',criado:{ts,...who()},notas:[],meds:[],vitais:{pa:d.pa,fc:d.fc,fr:d.fr,spo2:d.spo2,temp:d.temp,dor:d.dor,ts,...who()}};
 db.pts.push(p);pid=p.id;log(p,'Criou o prontuário (motivo: '+p.motivo+')');persist(p);tab='prontuario';view()})}
function vit(){const v=P().vitais||{};modal(`<form><h2>Registrar sinais vitais</h2><div class="row"><div><label>PA</label><input name="pa" value="${esc(v.pa)}"></div><div><label>FC (bpm)</label><input name="fc" value="${esc(v.fc)}"></div><div><label>FR (irpm)</label><input name="fr" value="${esc(v.fr)}"></div><div><label>SpO₂ (%)</label><input name="spo2" value="${esc(v.spo2)}"></div><div><label>Temperatura (°C)</label><input name="temp" value="${esc(v.temp)}"></div><div><label>Dor (0-10)</label><input name="dor" value="${esc(v.dor)}"></div></div>${foot}</form>`,d=>{const p=P();p.vitais={...d,ts:new Date().toISOString(),...who()};log(p,'Atualizou sinais vitais');persist(p);view()})}
function med(){modal(`<form><h2>Registrar medicação</h2><label>Medicamento *</label><input name="med" required><div class="row"><div><label>Dose *</label><input name="dose" required></div><div><label>Via</label><select name="via"><option>VO</option><option>IM</option><option>EV</option><option>SC</option></select></div></div><label>Horário</label><input name="hor" placeholder="ex.: 8h/20h"><label>Observação</label><input name="obs">${foot}</form>`,d=>{const p=P();p.meds.push({...d,ts:new Date().toISOString(),...who()});log(p,'Registrou medicação: '+d.med+' '+d.dose);persist(p);view()})}

view();
</script></body></html>
